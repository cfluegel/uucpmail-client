name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - run: go vet ./...
      - run: go test ./...
      - name: Schwachstellen-Scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  release-build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            arch: amd64
          - os: windows-latest
            goos: windows
            arch: amd64
          - os: macos-latest
            goos: darwin
            arch: arm64
          - os: macos-13
            goos: darwin
            arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Linux-Abhängigkeiten
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - name: Build
        run: go build -ldflags="-s -w" -o uucpmail-client${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/uucpmail-client
      - uses: actions/upload-artifact@v4
        with:
          name: uucpmail-client_${{ matrix.goos }}_${{ matrix.arch }}
          path: uucpmail-client*
