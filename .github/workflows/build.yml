name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # für das automatische Release bei v*-Tags

env:
  # Fyne braucht unter Linux GL-, X11- UND Wayland-Header (Fyne ≥ 2.8).
  LINUX_DEPS: libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: go vet ./...
      - run: go test ./...
      - name: Schwachstellen-Scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  release:
    # Läuft nur für Versions-Tags; baut alle Plattformen und hängt die
    # Artefakte an ein automatisch erstelltes GitHub-Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            arch: amd64
          - os: windows-latest
            goos: windows
            arch: amd64
          - os: macos-latest
            goos: darwin
            arch: arm64
          - os: macos-13
            goos: darwin
            arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Linux-Abhängigkeiten
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - name: Build
        shell: bash
        run: |
          EXT=""
          [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          go build -trimpath -ldflags="-s -w" -o "uucpmail-client${EXT}" ./cmd/uucpmail-client
      - name: Paketieren
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NAME="uucpmail-client_${VERSION}_${{ matrix.goos }}_${{ matrix.arch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "${NAME}.zip" uucpmail-client.exe LICENSE README.md > /dev/null
            echo "ASSET=${NAME}.zip" >> "$GITHUB_ENV"
          else
            tar czf "${NAME}.tar.gz" uucpmail-client LICENSE README.md
            echo "ASSET=${NAME}.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Release erstellen/ergänzen
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
